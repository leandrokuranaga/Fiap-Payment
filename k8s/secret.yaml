apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  labels:
    app: payment-api
type: Opaque
stringData:
  # Database (MySQL)
  ConnectionStrings__PaymentConnection: "${PAYMENT_CONNECTION}"
  ConnectionStrings__Redis: "${REDIS_CONNECTION}"
  ConnectionStrings__EventStore: "${EVENTSTORE_CONNECTION}"
  # Stripe
  Stripe__ApiKey: "${STRIPE_API_KEY}"
  Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET}"
  # AWS SQS
  ServiceBus__AccessKey: "${AWS_SQS_ACCESS_KEY}"
  ServiceBus__SecretKey: "${AWS_SQS_SECRET_KEY}"
  # AWS SDK Standard Credentials
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  # AWS Credentials para CloudWatch (usado pelo código)
  AWS_SQS_ACCESS_KEY: "${AWS_SQS_ACCESS_KEY}"
  AWS_SQS_SECRET_KEY: "${AWS_SQS_SECRET_KEY}"

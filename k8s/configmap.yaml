apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  labels:
    app: payment-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  TZ: "America/Sao_Paulo"
  # Logging
  Serilog__MinimumLevel__Default: "Information"
  # AWS Region
  AWS_REGION: "sa-east-1"
  # External Services URLs (inside cluster)
  CrmService__BaseUrl: "http://crm-service"
  FcgService__BaseUrl: "http://fcg-service"
